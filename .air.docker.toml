root = "."
tmp_dir = ".air-docker"

[build]
  cmd = "go build -o /tmp/hadesgate-dev ./cmd/hadesgate"
  entrypoint = "/tmp/hadesgate-dev"
  include_ext = ["go"]
  exclude_dir = ["frontend", "data", ".air", ".air-docker", ".devlogs", "docs", "benchmarks", "internal/web/dist"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true

