root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/hadesgate-dev.exe ./cmd/hadesgate"
  entrypoint = "./.air/hadesgate-dev.exe"
  include_ext = ["go"]
  exclude_dir = ["frontend", "data", ".air", ".air-docker", ".devlogs", "docs", "benchmarks", "internal/web/dist"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true

