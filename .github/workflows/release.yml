name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Binaries & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compile Frontend Static Assets
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Quality Gate (Go Vet & PII Benchmark)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run ./cmd/pii-benchmark -min-precision 0.90 -min-recall 0.90
          go test -count=1 ./...

      - name: Build Multi-Platform Releases & Browser Extensions
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.version || 'v2.0.0' }}"
          fi
          go run ./cmd/build-release -version "$VERSION" -out dist/releases

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HadesGate ${{ github.ref_name || github.event.inputs.version }}"
          files: |
            dist/releases/*
          generate_release_notes: true
          draft: false
          prerelease: false

