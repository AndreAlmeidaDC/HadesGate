name: Harness

on:
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - AGENTS.md
      - CLAUDE.md
      - frontend/AGENTS.md
      - .gitignore
      - .gitattributes
      - .github/workflows/harness.yml
  pull_request:
    paths:
      - ".claude/**"
      - AGENTS.md
      - CLAUDE.md
      - frontend/AGENTS.md
      - .gitignore
      - .gitattributes
      - .github/workflows/harness.yml

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run HadesGate harness tests
        run: |
          node --test --test-reporter=spec ".claude/**/*.test.mjs"

