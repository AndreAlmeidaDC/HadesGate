name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go Quality & PII Accuracy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go Vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Go Vulnerability Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Go Unit Tests with Race Detector
        run: go test -race -count=1 ./...
      - name: PII Detection Accuracy Benchmark Gate (>= 90%)
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/pii-benchmark -min-precision 0.90 -min-recall 0.90

  frontend:
    name: Frontend Typecheck & Static Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build
